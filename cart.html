<style>
.site-header {
width: 100%;
background: #fff;
position: fixed;
top: 0;
left: 0;
right: 0;
z-index: 9999;
box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}
body {
padding-top: 125px;
}

@media (max-width: 900px) {
body {
  padding-top: 75px;
}
}

.navbar {
width: 100%;
max-width: 1400px;
margin: auto;
padding: 15px 30px 12px;
display: flex;
flex-direction: column;
align-items: center;
gap: 17px;
}

.navbar-logo {
display: block;
text-align: center;
}

.navbar-logo img {
display: block;
width: 155px;
height: auto;
margin: auto;
object-fit: contain;
}

.nav-links {
display: flex;
align-items: center;
justify-content: center;
flex-wrap: wrap;
gap: 30px;
list-style: none;
margin: 0;
padding: 0;
}

.nav-links a {
display: flex;
align-items: center;
gap: 7px;
color: #292929;
text-decoration: none;
font-size: 14px;
font-weight: 600;

.nav-links svg {

.menu-toggle {

background: none;
font-size: 27px;

@media (max-width: 900px) {

  flex-direction: row;
  justify-content: space-between;
  padding: 12px 20px;

  margin: auto;

  width: 130px;

  display: block;
  position: absolute;
  right: 20px;

  display: none;
  position: absolute;
  top: 100%;
  left: 0;
  right: 0;
  background: #fff;

  align-items: flex-start;

<style>
  :root { --bg:#fff; --text:#23282a; --muted:#6b7275; --accent:#1f6f4a; --border:#d7d7d7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--text); background:var(--bg); }
  .page { max-width:1200px; margin:0 auto; padding:32px 20px; }
  h1 { text-align:center; font-size:32px; margin:0 0 32px; }
  .cart { display:grid; grid-template-columns:3fr 2fr; gap:48px; align-items:start; }
  .item { display:grid; grid-template-columns:140px 1fr auto auto; gap:20px; align-items:center; padding:20px 0; border-bottom:1px solid var(--border); }
  .thumb { width:140px; aspect-ratio:1/1; background:#f2f2f2; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; text-align:center; }
  .thumb img { width:100%; height:100%; object-fit:contain; }
  .name { font-weight:700; font-size:18px; margin-bottom:6px; }
  .delivery, .unit, .vat { color:var(--muted); font-size:14px; }
  .qty select { padding:8px 12px; border:1px solid var(--border); border-radius:4px; font-size:16px; background:#fff; }
  .line-price { text-align:right; font-weight:700; font-size:18px; }
  .remove { background:none; border:0; color:var(--muted); font-size:22px; cursor:pointer; line-height:1; }
  .remove:hover { color:var(--text); }
  .summary { border:1px solid var(--border); border-radius:6px; padding:24px; position:sticky; top:24px; }
  .row { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:12px; }
  .subtotal { font-size:20px; font-weight:700; }
  .small { color:var(--muted); font-size:13px; text-align:center; margin:12px 0 20px; }
  .btn { display:block; width:100%; padding:14px; border-radius:4px; font-size:16px; font-weight:600; text-align:center; text-decoration:none; cursor:pointer; border:1px solid var(--accent); }
  .btn-primary { background:var(--accent); color:#fff; margin-top:12px; }
  .btn-primary:hover { filter:brightness(1.1); }
  .btn-secondary { background:#fff; color:var(--accent); }
  .empty { text-align:center; padding:48px 0; color:var(--muted); }
  @media (max-width:768px) {
    .cart { grid-template-columns:1fr; gap:24px; }
    .item { grid-template-columns:90px 1fr; }
    .thumb { width:90px; }
    .summary { position:static; }
  }
</style>
</head>
<body>
<main class="page">
  <h1>Panier</h1>
  <div class="cart" id="cart">
    <section id="items">
      <div class="item" id="item">
        <div class="thumb">
      <img src="https://benelux.vorwerk.com/cdn/shop/files/TM7.png?v=1772528845&width=540" alt="Nom du produit">
          
        </div>
        <div>
          <div class="name">Nom du produit</div>
          <div class="delivery">Livraison sous 1 à 5 jours ouvrés</div>
          <div class="unit">Prix unitaire : €800,00</div>
        </div>
        <div class="qty">
          <label for="qty" style="position:absolute;left:-9999px">Quantité</label>
          <select id="qty">
            <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
            <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
          </select>
        </div>
        <div>
          <div class="line-price" id="line">€800,00</div>
          <div class="vat" style="text-align:right">TVA incluse</div>
          <div style="text-align:right"><button class="remove" id="remove" aria-label="Retirer">×</button></div>
        </div>
      </div>
    </section>

    <aside class="summary">
      <div class="row subtotal"><span>Sous-total</span><span id="subtotal">€800,00</span></div>
      <div class="small">Taxes incluses. Expédition calculée à la caisse.</div>
      <a href="index.html" class="btn btn-secondary">Continuer vos achats</a>
      <button class="btn btn-primary" id="checkout" type="button">Procéder au paiement</button>
    </aside>
  </div>
</main>
<script>

const PRICE = 800;
const PRODUCT_NAME = 'Thermomix® TM7';

const qty = document.getElementById('qty');

function formatPrice(amount) {
  return '€' + amount.toLocaleString('fr-BE', {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
}

function updateCart() {
  const quantity = parseInt(qty.value, 10);
  const total = PRICE * quantity;

  document.getElementById('line').textContent = formatPrice(total);
  document.getElementById('subtotal').textContent = formatPrice(total);

  localStorage.setItem('demoOrder', JSON.stringify({
    name: PRODUCT_NAME,
    price: PRICE,
    quantity: quantity
  }));
}

qty.addEventListener('change', updateCart);

document.getElementById('remove').addEventListener('click', function () {
  localStorage.removeItem('demoOrder');

  document.getElementById('items').innerHTML =
    '<div class="empty">Votre panier est vide.</div>';

  document.getElementById('subtotal').textContent = formatPrice(0);

  document.getElementById('checkout').disabled = true;
});

document.getElementById('checkout').addEventListener('click', function () {
  if (!localStorage.getItem('demoOrder')) {
    alert('Votre panier est vide.');
    return;
  }

  window.location.href = 'checkout.html';
});

// Save the initial order
update();

</script>
</body>
</html>
